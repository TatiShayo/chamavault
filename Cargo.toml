[package]
name = "chamavault-ledger"
version = "0.1.0"
edition = "2021"
description = "ACID double-entry FinTech ledger engine - Rust"

[[bin]]
name = "chamavault-ledger"
path = "rust_src/src/main.rs"

[lib]
name = "chamavault_ledger"
path = "rust_src/src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
